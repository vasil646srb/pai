<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Службы — Personal AI</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7385; --line:#dfe3ea; --accent:#3b6cf6; --ok:#1f9d55; --bad:#d64545; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#14171e; --card:#1d222c; --text:#e6e9f0; --muted:#8e97a8; --line:#2c3340; } }
  :root[data-theme="dark"] { --bg:#14171e; --card:#1d222c; --text:#e6e9f0; --muted:#8e97a8; --line:#2c3340; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--muted); margin:8px 0 4px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1 1 180px; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--text); }
  .check input { width:auto; }
  button { padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font:inherit; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .meta { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
  .badge.on { color:var(--ok); border-color:var(--ok); }
  .badge.off { color:var(--muted); }
  .badge.run { color:var(--accent); border-color:var(--accent); }
  .run { border-top:1px solid var(--line); padding:8px 0; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .run.err { color:var(--bad); }
  .msg { font-size:13px; margin-top:8px; color:var(--muted); }
  .msg.err { color:var(--bad); }
  a.back { color:var(--accent); text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← к чату</a>
  <h1>Службы</h1>
  <p class="meta">Служба — это задание для персоны, которое выполняется само через заданный интервал. Ответы сохраняются в истории службы.</p>

  <div class="card">
    <strong id="formTitle">Новая служба</strong>
    <input type="hidden" id="editId" />
    <div class="row">
      <div><label>Название</label><input id="name" maxlength="80" /></div>
      <div><label>Персона</label><select id="persona"></select></div>
    </div>
    <label>Задание (промпт)</label>
    <textarea id="prompt" maxlength="4000" placeholder="Например: проверь новые заметки за сутки и напиши краткую сводку"></textarea>
    <div class="row">
      <div><label>Интервал, минут</label><input id="interval" type="number" min="1" max="10080" value="60" /></div>
      <div><label>Пространство памяти</label><input id="space" value="personal" /></div>
    </div>
    <label class="check"><input id="enabled" type="checkbox" checked /> Включена</label>
    <div class="actions">
      <button class="primary" id="btnSave">Создать</button>
      <button id="btnCancel" hidden>Отмена</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="list"></div>
</main>

<script src="/static/services-page.js"></script>
</body>
</html>
