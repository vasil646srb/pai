[project]
name = "pai"
version = "0.1.0"
description = "Personal AI assistant core with memory tree, personas and autonomous services"
requires-python = ">=3.10"
dynamic = []
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
include = ["pai*"]

[tool.setuptools.package-data]
pai = ["prompts/*.md", "prompts/addons/*.md", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["pai_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
# E501: long lines are tolerated for now (prompt strings);
# B008: FastAPI's Depends()/Body() defaults are the framework idiom.
ignore = ["E501", "B008"]
